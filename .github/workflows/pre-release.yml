name: Pre-release library

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Lint documentation UI JS package
        working-directory: documentation-ui
        run: |
          pnpm i --frozen-lockfile
          pnpm run lint

  test_node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Test documentation UI JS package
        working-directory: documentation-ui
        run: |
          pnpm i --frozen-lockfile
          pnpm test -- --run

  pre_release_node:
    runs-on: ubuntu-latest
    needs: [lint_node, test_node]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Ensure workflow was run on a non-main branch
        if: github.ref_type != 'branch' || github.ref_name == 'main'
        run: |
          echo "::error::Pre-releases must be run from a branch other than main."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No cache restore in a publishing job, so a lower-trust run can't poison the release.
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - name: Build documentation UI JS package
        working-directory: documentation-ui
        run: |
          pnpm i --frozen-lockfile
          pnpm run build
      - name: Configure semantic-release for a pre-release from this branch
        working-directory: documentation-ui
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # Prerelease identifiers (and npm dist-tags) may only contain [0-9A-Za-z-].
          PRERELEASE_ID=$(echo "$BRANCH_NAME" | sed -E 's/[^0-9A-Za-z-]+/-/g; s/^-+//; s/-+$//')
          # Avoid empty ids, numeric ids with leading zeros, and dist-tags that parse as semver ranges.
          if [[ -z "$PRERELEASE_ID" || "$PRERELEASE_ID" =~ ^v?[0-9] ]]; then
            PRERELEASE_ID="branch${PRERELEASE_ID:+-$PRERELEASE_ID}"
          fi
          export PRERELEASE_ID
          echo "Pre-release identifier / npm dist-tag: $PRERELEASE_ID"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.release = {
              ...pkg.release,
              branches: [
                "main",
                {
                  name: process.env.BRANCH_NAME,
                  prerelease: process.env.PRERELEASE_ID,
                  channel: process.env.PRERELEASE_ID,
                },
              ],
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
      - name: Pre-release documentation UI JS package
        working-directory: documentation-ui
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
